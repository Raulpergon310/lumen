# Lumen: configuración de mpv

# Vídeo: renderizador moderno con HDR / Dolby Vision.
# Con «Usar HDR» activado en Windows (Configuración > Pantalla) se envía HDR real a la pantalla;
# si no, el HDR se convierte a SDR con mapeo de tonos para que no se vea lavado ni oscuro.
vo=gpu-next
gpu-api=d3d11
hwdec=auto-safe
# auto: pide HDR a la pantalla solo cuando Windows la tiene en modo HDR (con «yes» algunas
# pantallas SDR recibían una salida de 10 bits mal interpretada).
target-colorspace-hint=auto
d3d11-output-csp=auto
d3d11-output-format=auto
# Conversión HDR -> SDR: pico de brillo medido escena a escena (ignora destellos sueltos),
# recupera el detalle que se pierde al comprimir y mantiene los colores dentro de la pantalla.
tone-mapping=auto
hdr-compute-peak=yes
hdr-peak-percentile=99.995
hdr-contrast-recovery=0.30
gamut-mapping-mode=auto
# Subtítulos e imágenes a brillo SDR normal sobre vídeo HDR (no deslumbran).
sub-hdr-peak=sdr
image-subs-hdr-peak=sdr
dither-depth=auto

# Audio: Atmos, TrueHD, DTS y E-AC3 se decodifican y se mezclan para auriculares/altavoces.
audio-channels=auto-safe
volume-max=150
audio-file-auto=no

# Ventana
force-window=immediate
fullscreen=yes
keep-open=no
title=${media-title}
cursor-autohide=1500

# Controles en pantalla
osc=yes
osd-bar=no
osd-font="Segoe UI Variable Display"
osd-font-size=34
osd-border-size=1.5
script-opts-append=osc-layout=bottombar
script-opts-append=osc-seekbarstyle=bar
script-opts-append=osc-hidetimeout=2000
script-opts-append=osc-boxalpha=60
script-opts-append=osc-windowcontrols=auto

# Subtítulos: los ASS de anime mantienen su estilo; SRT con un estilo limpio
sub-auto=no
sub-font="Segoe UI Semibold"
sub-font-size=44
sub-border-size=2.5
sub-shadow-offset=1
sub-ass-override=scale
embeddedfonts=yes

# Red: búfer suficiente para el original sin cortes, sin leer el archivo del NAS a ráfagas
# enormes (eso dejaba al servidor sin aire para responder a la app).
cache=yes
demuxer-max-bytes=300MiB
demuxer-max-back-bytes=64MiB
demuxer-readahead-secs=30
network-timeout=30
save-position-on-quit=no

# Arranque más rápido: sin comprobación de vídeos de internet (yt-dlp) ni scripts que no se usan
ytdl=no
load-stats-overlay=no
load-console=no
load-select=no
